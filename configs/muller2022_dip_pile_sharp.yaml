# Müller et al. (2022), tuned settings plus everything from 1 November 2026 (show-me/2026-11-01-dip-llsvp-frame/):
# slabs dip at 30 deg above 100 km and 40 deg below in the upper mantle (fits Slab1.0, the fast vote maps and REVEAL/SEMUCB-WM1); flow-driven pile
# at -5 % with a warm layer 600 km thick above it (-2 %); slabs resting on the CMB warm with a 25 Myr e-folding time.
#
# This copy runs from 1000 Ma with a slab width profile drawn on a 1 deg grid: slabs about 80 km wide (0.75 deg)
# above 670 km, 2 deg just below it, widening to 3.5 deg at the CMB; 50 km vertical smoothing in the upper mantle.
# (dVs was then also blurred 5 deg / 150 km for scoring, with dVs_native the field before it; removed 11 Nov 2026.)
#
#   conda run -n pygmt17 python -m slablet.gplates.run_mantle configs/muller2022_dip_pile_sharp.yaml
name: muller2022
model_dir: /Users/simon/Library/Caches/gprm/Muller2022
rotation_files:
- optimisation/1000_0_rotfile_MantleOpt.rot
topology_files:
- Topologies/*.gpml
anchor_plate_id: 0
start_ma: 1000
end_ma: 0
delta_time: 1
output_every_myr: 20
initial_slabs: columns
output_dir: runs_real/muller2022_dip_pile_sharp
cache_dir: runs_real/cache
mantle:
  mantle_field_spacing_deg: 1.0
  slab_sigma_deg: 0.75
  slab_sigma_lower_deg: 2.0
  slab_sigma_cmb_deg: 3.5
  slab_sigma_depth_upper_km: 50
  slab_sink_rate_factor: 0.5
  slab_slowing_factor: 3
  slab_max_sink_rate: 400
  slab_thermal_tau_myr: 200
  slab_at_cmb: rest
  mantle_bin_area_normalise: true
  cmb_suppression_thermal_decay: true
  initial_slab_depth_km: 1320
  mantle_grid_spacing_deg: 5.0
  mantle_depth_interval_km: 100
  cmb_heating_rate: 0.02
  cmb_slab_suppression: 0.05
  cmb_surface_coupling: 0.1
  cmb_sigma_deg: 10.0
  cmb_max_heat: 3.0
  cmb_dVs_scale: -0.5
  cmb_decay_km: 400.0
  llsvp: pile
  pile_drive: flow
  pile_slab_head_km: 10000
  pile_slab_layer_km: 1000
  pile_mean_thickness_km: 150
  pile_mobility_km_per_myr: 30
  pile_dVs: -5
  pile_halo_km: 600
  pile_halo_dVs: -2
  pile_halo_h_km: 300
  slab_cmb_tau_myr: 25
  slab_dip_deg: 40
  slab_dip_shallow_deg: 30
  slab_dip_shallow_km: 100
tomography:
- name: REVEAL
  file: /Users/simon/Data/SeismicTomography/Schouten_Supplementary_material/Models/REVEAL_downsampled_anomaly.nc
  variable: vs_anomaly
  depths_km:
