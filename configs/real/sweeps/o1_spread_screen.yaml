# Against the Müller 2022 OPT1 convection model, 0-240 Ma weighted (reconstructions/sweep_opt1.py):
# slab spreading on the CMB x pile screening x the tomography blur, from the dip + pile model; and no pile.
name: o1_spread_screen
base: configs/real/muller2022_dip_pile_1000.yaml
variants:
  base: {}
  sp5: {mantle.slab_cmb_spread_km_per_myr: 5}
  sp15: {mantle.slab_cmb_spread_km_per_myr: 15}
  sc30: {mantle.pile_flow_screen_deg: 30}
  sc15: {mantle.pile_flow_screen_deg: 15}
  sp5_sc30: {mantle.slab_cmb_spread_km_per_myr: 5, mantle.pile_flow_screen_deg: 30}
  sp15_sc30: {mantle.slab_cmb_spread_km_per_myr: 15, mantle.pile_flow_screen_deg: 30}
  sp5_sc15: {mantle.slab_cmb_spread_km_per_myr: 5, mantle.pile_flow_screen_deg: 15}
  sp15_sc15: {mantle.slab_cmb_spread_km_per_myr: 15, mantle.pile_flow_screen_deg: 15}
  sharp: {mantle.tomo_smooth_horiz_deg: 0, mantle.tomo_smooth_depth_km: 0}
  sharp_sp5: {mantle.tomo_smooth_horiz_deg: 0, mantle.tomo_smooth_depth_km: 0, mantle.slab_cmb_spread_km_per_myr: 5}
  sharp_sp15: {mantle.tomo_smooth_horiz_deg: 0, mantle.tomo_smooth_depth_km: 0, mantle.slab_cmb_spread_km_per_myr: 15}
  sharp_sc15: {mantle.tomo_smooth_horiz_deg: 0, mantle.tomo_smooth_depth_km: 0, mantle.pile_flow_screen_deg: 15}
  sharp_sp15_sc15: {mantle.tomo_smooth_horiz_deg: 0, mantle.tomo_smooth_depth_km: 0, mantle.slab_cmb_spread_km_per_myr: 15, mantle.pile_flow_screen_deg: 15}
  sharp_sp15_sc30: {mantle.tomo_smooth_horiz_deg: 0, mantle.tomo_smooth_depth_km: 0, mantle.slab_cmb_spread_km_per_myr: 15, mantle.pile_flow_screen_deg: 30}
  nopile: {mantle.llsvp: none}
  nopile_sp15: {mantle.llsvp: none, mantle.slab_cmb_spread_km_per_myr: 15}
  nopile_sharp: {mantle.llsvp: none, mantle.tomo_smooth_horiz_deg: 0, mantle.tomo_smooth_depth_km: 0}
  nopile_sharp_sp15: {mantle.llsvp: none, mantle.tomo_smooth_horiz_deg: 0, mantle.tomo_smooth_depth_km: 0, mantle.slab_cmb_spread_km_per_myr: 15}
