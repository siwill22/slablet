# Against OPT1, 0-240 Ma weighted (reconstructions/sweep_opt1.py): slabs resting on the CMB live longer
# (slab_cmb_tau_myr 25 -> 100 or off) and spread faster; and the sinking rates.  From the dip + pile model.
name: o1_spread_life_sink
base: configs/real/muller2022_dip_pile_1000.yaml
variants:
  base: {}
  tau100: {mantle.slab_cmb_tau_myr: 100}
  tauoff: {mantle.slab_cmb_tau_myr: 0}
  sp30: {mantle.slab_cmb_spread_km_per_myr: 30}
  sp80: {mantle.slab_cmb_spread_km_per_myr: 80}
  tau100_sp30: {mantle.slab_cmb_tau_myr: 100, mantle.slab_cmb_spread_km_per_myr: 30}
  tau100_sp80: {mantle.slab_cmb_tau_myr: 100, mantle.slab_cmb_spread_km_per_myr: 80}
  tauoff_sp30: {mantle.slab_cmb_tau_myr: 0, mantle.slab_cmb_spread_km_per_myr: 30}
  tauoff_sp80: {mantle.slab_cmb_tau_myr: 0, mantle.slab_cmb_spread_km_per_myr: 80}
  tau100_sp30_layer600: {mantle.slab_cmb_tau_myr: 100, mantle.slab_cmb_spread_km_per_myr: 30, mantle.slab_cmb_spread_layer_km: 600}
  sink0.4: {mantle.slab_sink_rate_factor: 0.4}
  sink0.65: {mantle.slab_sink_rate_factor: 0.65}
  slow2: {mantle.slab_slowing_factor: 2}
  slow4: {mantle.slab_slowing_factor: 4}
