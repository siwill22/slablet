# Against OPT1, 0-240 Ma weighted (reconstructions/sweep_opt1.py), from the sharp-slab model with the seafloor cache and a
# fixed lower-mantle sinking rate of 15 km/Myr (the best convergence-independent rate in o2_rate_age_flow).
#   tbl      a thin hot boundary layer on top of the pile, pushed by the local slab load (gathers between slab pools)
#   plumes   hot conduits above its local maxima (or the pile's)
#   age_*    milder seafloor-age factors than o2 (weight only, or thermal time ~ sqrt(age))
#   flow     slabs drift with +0.3 of the plate velocity at 670 km to -0.3 at the CMB
name: o3_tbl_plumes
base: configs/real/muller2022_dip_pile_sharp.yaml
common: {seafloor: true, mantle.slab_lower_rate_km_per_myr: 15}
variants:
  lr15: {}
  lr15_tau100: {mantle.slab_cmb_tau_myr: 100}
  tbl100: {mantle.tbl_thickness_km: 100}
  tbl50_strong: {mantle.tbl_thickness_km: 50, mantle.tbl_dVs: -3}
  tbl100_mob100: {mantle.tbl_thickness_km: 100, mantle.tbl_mobility_km_per_myr: 100}
  tbl100_plumes: {mantle.tbl_thickness_km: 100, mantle.plume_dVs: -1.5}
  pile_plumes: {mantle.plume_dVs: -1.5}
  age_weight: {mantle.slab_age_ref_myr: 50, mantle.slab_age_tau_exponent: 0}
  age_tau_half: {mantle.slab_age_ref_myr: 50, mantle.slab_age_tau_exponent: 0.5}
  flow_p3_m3: {mantle.slab_flow_top: 0.3, mantle.slab_flow_bottom: -0.3}
  combo: {mantle.tbl_thickness_km: 100, mantle.plume_dVs: -1.5, mantle.slab_age_ref_myr: 50, mantle.slab_age_tau_exponent: 0,
          mantle.slab_flow_top: 0.3, mantle.slab_flow_bottom: -0.3}
  combo_tau100: {mantle.tbl_thickness_km: 100, mantle.plume_dVs: -1.5, mantle.slab_age_ref_myr: 50,
                 mantle.slab_age_tau_exponent: 0, mantle.slab_flow_top: 0.3, mantle.slab_flow_bottom: -0.3,
                 mantle.slab_cmb_tau_myr: 100}
