# Resolution tests (reconstructions/sweep_resolution.py) from the sharp-slab model (1 deg field, 5 deg dynamics,
# 100 km layers, 1 Myr steps, slabs every 1 deg along trenches).  Each variant changes one resolution:
#   dt2, dt05          the time step (2, 0.5 Myr)
#   s05                slab spacing along trenches (0.5 deg)
#   dyn25              the dynamics grid (pile, CMB heat, slab load) at 2.5 deg; drawn at 0.5 deg (the field grid
#                      must divide it), so compare with f05
#   f05, dz50          the drawn field: 0.5 deg, 50 km layers, and both
#   fine_all           everything fine at once (f05, dz50, s05, dt05)
# Slowest first, so that the 4 workers finish together.
name: r01_resolution
base: configs/real/muller2022_dip_pile_sharp.yaml
reference: ref
variants:
  fine_all: {mantle.mantle_field_spacing_deg: 0.5, mantle.mantle_depth_interval_km: 50, mantle.slab_sample_deg: 0.5, delta_time: 0.5}
  f05_dz50: {mantle.mantle_field_spacing_deg: 0.5, mantle.mantle_depth_interval_km: 50}
  dyn25: {mantle.mantle_field_spacing_deg: 0.5, mantle.mantle_grid_spacing_deg: 2.5}
  f05: {mantle.mantle_field_spacing_deg: 0.5}
  dt05: {delta_time: 0.5}
  s05: {mantle.slab_sample_deg: 0.5}
  dz50: {mantle.mantle_depth_interval_km: 50}
  ref: {}
  dt2: {delta_time: 2}
