# Mantle model driven by Müller et al. (2022, Solid Earth), v1.2.4, in its optimised mantle
# reference frame, 250 Ma to present.  The default real-reconstruction config.
#
#   conda run -n pygmt17 python reconstructions/run_mantle.py configs/real/muller2022.yaml
#
# Frame: the model folder holds three frames.  Rotations/1000_0_rotfile.rot is the
# palaeomagnetic frame (701 -> 070); optimisation/1000_0_rotfile_MantleOpt.rot is the optimised
# mantle frame (701 -> 000), which the model's GPlates project uses by default.  Slablets sink
# vertically in the frame of anchor_plate_id, so only the MantleOpt file is loaded, never
# both (they hold conflicting 701 rotations).
# The model's README: the Pacific plates' absolute positions between 250 and 83 Ma are slightly
# altered (Pacific-Africa motion from Young et al. 2019), and it advises another model for
# Pacific absolute motions.
name: muller2022
model_dir: /Users/simon/Library/Caches/gprm/Muller2022
rotation_files: [optimisation/1000_0_rotfile_MantleOpt.rot]
topology_files: [Topologies/*.gpml]   # 1000-410, 410-250 and 250-0 Ma boundaries + building blocks
anchor_plate_id: 0
start_ma: 250
end_ma: 0
delta_time: 1
output_every_myr: 10
initial_slabs: columns        # columns: each start-time trench gets a slab column to initial_slab_depth_km; none: empty mantle
output_dir: runs_real/muller2022
cache_dir: runs_real/cache

# Same keys as the PlateDriver config (mantle/params.py).  Values from configs/current_model.yaml
# except slab_thermal_tau_myr: 4 Myr there fades a slab to ~3% by 670 km, so 200 here.
mantle:
  slab_sink_rate_factor: 1.0
  slab_slowing_factor: 4
  slab_max_sink_rate: 400
  slab_thermal_tau_myr: 200
  initial_slab_depth_km: 1320
  mantle_grid_spacing_deg: 5.0
  mantle_depth_interval_km: 100
  cmb_heating_rate: 0.02
  cmb_slab_suppression: 0.05
  cmb_surface_coupling: 0.1
  cmb_sigma_deg: 10.0
  cmb_max_heat: 3.0
  cmb_dVs_scale: -0.5
  cmb_decay_km: 400.0
  tomo_smooth_horiz_deg: 5.0
  tomo_smooth_depth_km: 150.0
