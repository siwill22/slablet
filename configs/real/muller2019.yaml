# Alternative to configs/real/muller2022.yaml (the default): Müller et al. (2019), 250 Ma to present.
#
#   conda run -n pygmt17 python reconstructions/run_mantle.py configs/real/muller2019.yaml
#
# Frame: slablets sink vertically in the frame of anchor_plate_id, so it must be a mantle
# frame.  Plate 0 of this model has not been checked for that yet.
name: muller2019
model_dir: /Users/simon/Library/Caches/gprm/Muller2019/Muller_etal_2019_PlateMotionModel_v2.0_Tectonics
rotation_files: ["*.rot"]        # relative to model_dir; top level only (skips __MACOSX)
topology_files: ["*.gpml"]
anchor_plate_id: 0
start_ma: 250
end_ma: 0
delta_time: 1
output_every_myr: 10
initial_slabs: columns        # columns: each start-time trench gets a slab column to initial_slab_depth_km; none: empty mantle
output_dir: runs_real/muller2019
cache_dir: runs_real/cache

# Same keys as the PlateDriver config (mantle/params.py).  Values from configs/current_model.yaml
# except slab_thermal_tau_myr: 4 Myr there fades a slab to ~3% by 670 km, so 200 here.
mantle:
  slab_sink_rate_factor: 1.0
  slab_slowing_factor: 4
  slab_max_sink_rate: 400
  slab_thermal_tau_myr: 200
  initial_slab_depth_km: 1320
  mantle_grid_spacing_deg: 5.0
  mantle_depth_interval_km: 100
  cmb_heating_rate: 0.02
  cmb_slab_suppression: 0.05
  cmb_surface_coupling: 0.1
  cmb_sigma_deg: 10.0
  cmb_max_heat: 3.0
  cmb_dVs_scale: -0.5
  cmb_decay_km: 400.0
  tomo_smooth_horiz_deg: 5.0
  tomo_smooth_depth_km: 150.0
