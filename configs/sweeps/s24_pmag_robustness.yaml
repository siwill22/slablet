# Robustness of the palaeomagnetic-start fit B (s23: 51.26 S 0.90 E, 0.1 deg/Myr) across start times, against no rotation.
name: s24_pmag_robustness
base: configs/muller2022_pmag_dip_pile.yaml
common: {output_every_myr: 100000}
variants:
  none_st250: {start_ma: 250}
  none_st300: {start_ma: 300}
  none_st350: {start_ma: 350}
  B_st250: {start_ma: 250, frame_rotation: {pole_lat: -51.26, pole_lon: 0.9, deg_per_myr: 0.1}}
  B_st300: {start_ma: 300, frame_rotation: {pole_lat: -51.26, pole_lon: 0.9, deg_per_myr: 0.1}}
  B_st350: {start_ma: 350, frame_rotation: {pole_lat: -51.26, pole_lon: 0.9, deg_per_myr: 0.1}}
