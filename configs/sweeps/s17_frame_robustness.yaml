  C_st300: {start_ma: 300, frame_rotation: {pole_lat: -51.26, pole_lon: 0.9, deg_per_myr: 0.025}}
  D_st300: {start_ma: 300, frame_rotation: {pole_lat: -15.07, pole_lon: -11.49, deg_per_myr: 0.025}}
  Aold_st300: {start_ma: 300, frame_rotation: {pole_lat: -51.26, pole_lon: 0.9, deg_per_myr: 0.075, from_ma: 100}}
  none_st330: {start_ma: 330}
  A_st330: {start_ma: 330, frame_rotation: {pole_lat: -51.26, pole_lon: 0.9, deg_per_myr: 0.05}}
  B_st330: {start_ma: 330, frame_rotation: {pole_lat: -27.39, pole_lon: 20.97, deg_per_myr: 0.05}}
  C_st330: {start_ma: 330, frame_rotation: {pole_lat: -51.26, pole_lon: 0.9, deg_per_myr: 0.025}}
  D_st330: {start_ma: 330, frame_rotation: {pole_lat: -15.07, pole_lon: -11.49, deg_per_myr: 0.025}}
  Aold_st330: {start_ma: 330, frame_rotation: {pole_lat: -51.26, pole_lon: 0.9, deg_per_myr: 0.075, from_ma: 100}}
