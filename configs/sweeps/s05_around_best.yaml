# Robustness and untested dimensions around the s04 best:
# sink 0.5, slowing 3, tau 200, slab_at_cmb rest, llsvp none, start 250 Ma.
name: s05_around_best
base: configs/muller2022.yaml
common:
  output_every_myr: 100000
  mantle: {slab_sink_rate_factor: 0.5, slab_slowing_factor: 3, slab_thermal_tau_myr: 200,
           slab_at_cmb: rest, llsvp: none}
variants:
  best: {}
  # depth of the switch to lower-mantle sinking (a crude sinking-rate profile)
  um_500: {mantle: {upper_mantle_km: 500}}
  um_800: {mantle: {upper_mantle_km: 800}}
  um_1000: {mantle: {upper_mantle_km: 1000}}
  um_1200: {mantle: {upper_mantle_km: 1200}}
  um_1500: {mantle: {upper_mantle_km: 1500}}
  # neighbours
  tau_150: {mantle: {slab_thermal_tau_myr: 150}}
  tau_250: {mantle: {slab_thermal_tau_myr: 250}}
  tau_300: {mantle: {slab_thermal_tau_myr: 300}}
  f_0.4: {mantle: {slab_sink_rate_factor: 0.4}}
  f_0.6: {mantle: {slab_sink_rate_factor: 0.6}}
  s_2.5: {mantle: {slab_slowing_factor: 2.5}}
  s_3.5: {mantle: {slab_slowing_factor: 3.5}}
  start_300: {start_ma: 300}
  start_350: {start_ma: 350}
  start_200: {start_ma: 200}
  init_none: {initial_slabs: none}
  init_660: {mantle: {initial_slab_depth_km: 660}}
  init_2000: {mantle: {initial_slab_depth_km: 2000}}
  maxsink_100: {mantle: {slab_max_sink_rate: 100}}
  # smoothing
  tomoh_7.5: {mantle: {tomo_smooth_horiz_deg: 7.5}}
  tomoh_10: {mantle: {tomo_smooth_horiz_deg: 10.0}}
  sigma_4: {mantle: {slab_sigma_deg: 4.0}}
  sigma_5: {mantle: {slab_sigma_deg: 5.0}}
  # resolution
  grid_2.5: {mantle: {mantle_grid_spacing_deg: 2.5}}
  dz_50: {mantle: {mantle_depth_interval_km: 50}}
  # frames at the optimum
  frame_nnr: {name: muller2022_nnr, rotation_files: [optimisation/no_net_rotation_model.rot]}
  frame_palaeomag: {name: muller2022_pmag, rotation_files: [Rotations/1000_0_rotfile.rot]}
  # another reconstruction at the optimum
  muller2019: {name: muller2019, model_dir: /Users/simon/Library/Caches/gprm/Muller2019/Muller_etal_2019_PlateMotionModel_v2.0_Tectonics,
               rotation_files: ['*.rot'], topology_files: ['*.gpml']}
  # LLSVP alternatives at the optimum
  heat_coupling0: {mantle: {llsvp: heat, cmb_surface_coupling: 0.0}}
  remove_at_cmb: {mantle: {slab_at_cmb: remove}}
