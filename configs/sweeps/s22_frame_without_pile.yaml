# Frame rotation A without a pile (tuned, and tuned + dip), starts 250/300/350: does the frame gain need the pile?
name: s22_frame_without_pile
base: configs/muller2022_tuned.yaml
common:
  output_every_myr: 100000
variants:
  dip_st250:
    start_ma: 250
    mantle: &id001
      slab_dip_deg: 40
      slab_dip_shallow_deg: 30
      slab_dip_shallow_km: 100
  dipA_st250:
    start_ma: 250
    mantle: *id001
    frame_rotation: &id002
      pole_lat: -51.26
      pole_lon: 0.9
      deg_per_myr: 0.05
  tuned_st250:
    start_ma: 250
  tunedA_st250:
    start_ma: 250
    frame_rotation: *id002
  dip_st300:
    start_ma: 300
    mantle: *id001
  dipA_st300:
    start_ma: 300
    mantle: *id001
    frame_rotation: *id002
  tuned_st300:
    start_ma: 300
  tunedA_st300:
    start_ma: 300
    frame_rotation: *id002
  dip_st350:
    start_ma: 350
    mantle: *id001
  dipA_st350:
    start_ma: 350
    mantle: *id001
    frame_rotation: *id002
  tuned_st350:
    start_ma: 350
  tunedA_st350:
    start_ma: 350
    frame_rotation: *id002
