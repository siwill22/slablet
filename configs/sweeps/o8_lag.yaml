# The refined model (configs/muller2022_refined.yaml) with the timing of lower-mantle sinking changed.  OPT1's coldest
# regions at 0 Ma overlap past subduction best for a lag of about 100 Myr at 1450 km and about 140 Myr at 2750 km (IoU
# 0.30 and 0.24 at most); the refined model reaches 1450 km in about 70 Myr.  So: a slower start that speeds up with
# depth (slab_lower_rate_gradient), and a shorter rest on the CMB (deep cold = recent arrivals).
name: o8_lag
base: configs/muller2022_refined.yaml
variants:
  final: {}
  lr10_grad2: {mantle.slab_lower_rate_km_per_myr: 10, mantle.slab_lower_rate_gradient: 2}
  lr12_grad1: {mantle.slab_lower_rate_km_per_myr: 12, mantle.slab_lower_rate_gradient: 1}
  lr10_grad1: {mantle.slab_lower_rate_km_per_myr: 10, mantle.slab_lower_rate_gradient: 1}
  rest10: {mantle.slab_cmb_tau_myr: 10}
  rest50: {mantle.slab_cmb_tau_myr: 50}
  lr12_grad1_rest10: {mantle.slab_lower_rate_km_per_myr: 12, mantle.slab_lower_rate_gradient: 1, mantle.slab_cmb_tau_myr: 10}
  lr10_grad2_rest10: {mantle.slab_lower_rate_km_per_myr: 10, mantle.slab_lower_rate_gradient: 2, mantle.slab_cmb_tau_myr: 10}
