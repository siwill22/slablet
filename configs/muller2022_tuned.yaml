# Müller et al. (2022) mantle run with the settings that fitted REVEAL and SEMUCB-WM1 best in the overnight
# sweeps of 2026-10-31 (show-me/2026-11-01-overnight-tuning/README.md), without the blur that scores better only
# by hiding higher degrees.  Differences from muller2022.yaml: start 300 Ma; lower-mantle sinking = 0.5/3 = 0.17 x
# convergence (~9 km/Myr); slab tau 200 Myr; slabs rest on the CMB; no LLSVP component (llsvp: none).
#
#   conda run -n pygmt17 python -m slablet.gplates.run_mantle configs/muller2022_tuned.yaml
name: muller2022
model_dir: $GPRM_CACHE/Muller2022
rotation_files:
- optimisation/1000_0_rotfile_MantleOpt.rot
topology_files:
- Topologies/*.gpml
anchor_plate_id: 0
start_ma: 300
end_ma: 0
delta_time: 1
output_every_myr: 10
initial_slabs: columns
output_dir: runs_real/muller2022_tuned
cache_dir: runs_real/cache
mantle:
  slab_sink_rate_factor: 0.5
  slab_slowing_factor: 3
  slab_max_sink_rate: 400
  slab_thermal_tau_myr: 200
  slab_at_cmb: rest
  mantle_bin_area_normalise: true
  cmb_suppression_thermal_decay: true
  initial_slab_depth_km: 1320
  mantle_grid_spacing_deg: 5.0
  mantle_depth_interval_km: 100
  cmb_heating_rate: 0.02
  cmb_slab_suppression: 0.05
  cmb_surface_coupling: 0.1
  cmb_sigma_deg: 10.0
  cmb_max_heat: 3.0
  cmb_dVs_scale: -0.5
  cmb_decay_km: 400.0
  llsvp: none
tomography:
- name: REVEAL
  file: $SLABLET_DATA/SeismicTomography/Schouten_Supplementary_material/Models/REVEAL_downsampled_anomaly.nc
  variable: vs_anomaly
  depths_km:
  - 1000
  - 1100
  - 1200
  - 1300
  - 1400
  - 1500
  - 1600
  - 1700
  - 1800
  - 1900
  - 2000
  - 2100
  - 2200
  - 2300
  - 2400
  - 2500
  - 2600
  - 2700
  - 2800
  slow_fraction: 0.3
  fast_fraction: 0.2
  lmax: 8
- name: SEMUCB-WM1
  file: $SLABLET_DATA/SeismicTomography/Schouten_Supplementary_material/Models/SEMUCB_WM1_anomaly.nc
  variable: vs_anomaly
  depths_km:
  - 1000
  - 1100
  - 1200
  - 1300
  - 1400
  - 1500
  - 1600
  - 1700
  - 1800
  - 1900
  - 2000
  - 2100
  - 2200
  - 2300
  - 2400
  - 2500
  - 2600
  - 2700
  - 2800
  slow_fraction: 0.3
  fast_fraction: 0.2
  lmax: 8
