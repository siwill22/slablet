# Alternative to configs/muller2022.yaml (the default): Müller et al. (2019), 250 Ma to present.
#
#   conda run -n pygmt17 python -m slablet.gplates.run_mantle configs/muller2019.yaml
#
# Frame: slablets sink vertically in the frame of anchor_plate_id, so it must be a mantle
# frame.  Plate 0 of this model has not been checked for that yet.
name: muller2019
model_dir: $GPRM_CACHE/Muller2019/Muller_etal_2019_PlateMotionModel_v2.0_Tectonics
rotation_files: ["*.rot"]        # relative to model_dir; top level only (skips __MACOSX)
topology_files: ["*.gpml"]
anchor_plate_id: 0
start_ma: 250
end_ma: 0
delta_time: 1
output_every_myr: 10
initial_slabs: columns        # columns: each start-time trench gets a slab column to initial_slab_depth_km; none: empty mantle
output_dir: runs_real/muller2019
cache_dir: runs_real/cache

# Same keys as the PlateDriver config (mantle/params.py).  Values from configs/current_model.yaml
# except that the two fixes below are on (off by default so PlateDriver runs reproduce).
# slab_thermal_tau_myr is open for tuning.
mantle:
  slab_sink_rate_factor: 1.0
  slab_slowing_factor: 4
  slab_max_sink_rate: 400
  slab_thermal_tau_myr: 100
  slab_at_cmb: remove                   # remove | rest
  mantle_bin_area_normalise: true
  cmb_suppression_thermal_decay: true
  initial_slab_depth_km: 1320
  mantle_grid_spacing_deg: 5.0
  mantle_depth_interval_km: 100
  cmb_heating_rate: 0.02
  cmb_slab_suppression: 0.05
  cmb_surface_coupling: 0.1
  cmb_sigma_deg: 10.0
  cmb_max_heat: 3.0
  cmb_dVs_scale: -0.5
  cmb_decay_km: 400.0

# Present-day comparison (slablet/analysis/tomography_score.py): shape only, no amplitudes.
# Each model is scored at the file depth nearest to each of depths_km.
tomography:
  - name: REVEAL
    file: $SLABLET_DATA/SeismicTomography/Schouten_Supplementary_material/Models/REVEAL_downsampled_anomaly.nc
    variable: vs_anomaly
    depths_km: [1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2500, 2600, 2700, 2800]
    slow_fraction: 0.3    # area share of the sphere called slow in each field, per depth
    fast_fraction: 0.2
    lmax: 8
  - name: SEMUCB-WM1
    file: $SLABLET_DATA/SeismicTomography/Schouten_Supplementary_material/Models/SEMUCB_WM1_anomaly.nc
    variable: vs_anomaly
    depths_km: [1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2500, 2600, 2700, 2800]
    slow_fraction: 0.3
    fast_fraction: 0.2
    lmax: 8
